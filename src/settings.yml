- keyname: mode
  field_type: select
  name: Affichage
  description: Auto montre le programme en cours et le suivant, puis la soirée (première et seconde partie) de 18 h à 22 h.
  options:
  - Auto: auto
  - En ce moment: now
  - Ce soir: tonight
  default: auto
- keyname: about
  field_type: author_bio
  name: À propos
  category: entertainment
  github_url: https://github.com/rivallinkil/trmnl-tv-schedule
  description: 'Le programme télé des chaînes françaises : ce qui passe en ce moment et ce qui suit, puis la soirée (première et seconde partie) à partir de 18 h. Choisissez jusqu’à 10 chaînes parmi les quelque 400 accessibles en France (TNT, câble, satellite, chaînes locales).<br><br>Données : <a href="https://xmltvfr.fr" class="underline" target="_blank">XML TV Fr</a>, réduites toutes les 3 heures par un relais sur GitHub Pages. Aucun compte ni clé d’API.<br><br>Code source, suggestions et bugs : <a href="https://github.com/rivallinkil/trmnl-tv-schedule" class="underline" target="_blank">GitHub</a>'
