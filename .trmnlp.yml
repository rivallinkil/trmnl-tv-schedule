# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields:
  channels: [TF1.fr, France2.fr, France3.fr, CanalPlus.fr, France5.fr, M6.fr, Arte.fr, W9.fr, TMC.fr, NT1.fr]
  mode: auto

time_zone: Paris

# override variables
variables:
  trmnl: {}
